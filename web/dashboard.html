<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小谢状态中心</title>
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dash-header">
        <div class="header-left">
          <span class="logo-icon">🐱</span>
          <h1>小谢状态中心</h1>
        </div>
        <div class="header-right">
          <span class="conn-status" id="conn-status">
            <span class="conn-dot"></span>
            <span class="conn-text">连接中</span>
          </span>
          <span class="divider"></span>
          <span class="time-period" id="time-period">--</span>
          <span class="clock" id="clock">--:--:--</span>
        </div>
      </header>

      <main class="dash-main">
        <aside class="panel panel-activity">
          <h2 class="panel-title">
            <span class="title-icon">📋</span>最近活动
          </h2>
          <div class="panel-body" id="activity-list">
            <div class="empty-hint">等待活动中...</div>
          </div>
        </aside>

        <section class="panel panel-face">
          <div class="face-wrapper">
            <div class="face-glow" id="face-glow"></div>
            <div class="face-container">
              <div class="screen-face" id="face-stage">
                <svg id="face-svg" viewBox="0 0 300 240" role="img" aria-label="小谢表情">
                  <defs>
                    <filter id="blush-blur">
                      <feGaussianBlur stdDeviation="3" />
                    </filter>
                  </defs>

                  <!-- Ears -->
                  <path class="ear" id="ear-left" d="M78 88 L52 18 L118 68 Z" />
                  <path class="ear" id="ear-right" d="M222 88 L248 18 L182 68 Z" />
                  <path class="ear-inner" id="ear-inner-left" d="M80 82 L58 30 L112 70 Z" />
                  <path class="ear-inner" id="ear-inner-right" d="M220 82 L242 30 L188 70 Z" />

                  <!-- Eyebrows -->
                  <path class="eyebrow" id="eyebrow-left" d="M88 72 Q110 60 132 72" />
                  <path class="eyebrow" id="eyebrow-right" d="M168 72 Q190 60 212 72" />

                  <!-- Eyes -->
                  <g class="eye-group" id="eye-left-group" transform="translate(82 82)">
                    <rect class="eye-shell" x="0" y="0" rx="20" ry="20" width="56" height="78"></rect>
                    <circle class="pupil" id="eye-left-pupil" cx="28" cy="39" r="15"></circle>
                    <circle class="eye-highlight" cx="20" cy="30" r="5"></circle>
                  </g>
                  <g class="eye-group" id="eye-right-group" transform="translate(162 82)">
                    <rect class="eye-shell" x="0" y="0" rx="20" ry="20" width="56" height="78"></rect>
                    <circle class="pupil" id="eye-right-pupil" cx="28" cy="39" r="15"></circle>
                    <circle class="eye-highlight" cx="20" cy="30" r="5"></circle>
                  </g>

                  <!-- Blush -->
                  <circle class="blush" id="blush-left" cx="76" cy="148" r="16" />
                  <circle class="blush" id="blush-right" cx="224" cy="148" r="16" />

                  <!-- Mouth -->
                  <path class="mouth" id="mouth" d="M120 180 Q150 194 180 180"></path>

                  <!-- Hint text -->
                  <text class="hint-text" id="hint-text" x="245" y="60"> </text>

                  <!-- Floating particles -->
                  <g class="particles" id="particles"></g>
                </svg>
              </div>
            </div>
            <div class="face-shadow"></div>
          </div>

          <div class="face-info">
            <div class="mood-badge" id="status-mood">待机中</div>
            <h2 class="face-title" id="status-title">待机中</h2>
            <p class="face-message" id="status-message">正在连接状态服务...</p>
            <div class="face-meta" id="face-meta">
              <span class="tool-tag" id="tool-hint" style="display:none"></span>
              <span class="step-tag" id="step-hint" style="display:none"></span>
            </div>
            <p class="face-updated" id="status-updated">等待中</p>
          </div>
        </section>

        <aside class="panel panel-sessions">
          <h2 class="panel-title">
            <span class="title-icon">💬</span>会话状态
          </h2>
          <div class="panel-body" id="session-list">
            <div class="empty-hint">加载会话中...</div>
          </div>
          <div class="session-footer" id="session-footer">
            <span class="session-count" id="session-count">0 个活跃会话</span>
          </div>
        </aside>
      </main>

      <footer class="dash-footer">
        <h2 class="panel-title">
          <span class="title-icon">📊</span>情绪时间线
          <span class="timeline-range" id="timeline-range">最近 30 分钟</span>
        </h2>
        <div class="timeline-bar" id="emotion-timeline">
          <div class="timeline-empty">情绪变化将在这里显示</div>
        </div>
      </footer>
    </div>

    <script src="./dashboard.js"></script>
  </body>
</html>
