<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小谢状态中心</title>
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="dashboard">
      <header class="dash-header">
        <div class="header-left">
          <span class="logo-icon">🐱</span>
          <h1>小谢状态中心</h1>
        </div>
        <div class="header-right">
          <span class="conn-status" id="conn-status">
            <span class="conn-dot"></span>
            <span class="conn-text">连接中</span>
          </span>
          <span class="divider"></span>
          <span class="time-period" id="time-period">--</span>
          <span class="clock" id="clock">--:--:--</span>
        </div>
      </header>

      <main class="dash-main">
        <aside class="panel panel-activity">
          <h2 class="panel-title">
            <span class="title-icon">📋</span>最近活动
          </h2>
          <div class="panel-body" id="activity-list">
            <div class="empty-hint">等待活动中...</div>
          </div>
        </aside>

        <section class="panel panel-face">
          <div class="face-wrapper">
            <div class="face-glow" id="face-glow"></div>
            <div class="character" id="face-stage">
              <svg id="face-svg" viewBox="0 0 240 230" role="img" aria-label="小谢表情">
                <defs>
                  <filter id="blush-blur">
                    <feGaussianBlur stdDeviation="2.5" />
                  </filter>
                  <radialGradient id="body-gradient" cx="50%" cy="35%" r="60%">
                    <stop offset="0%" stop-color="white" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="white" stop-opacity="0" />
                  </radialGradient>
                </defs>

                <!-- Cat ears -->
                <path class="ear" d="M55 85 L38 15 L92 68 Z" />
                <path class="ear" d="M185 85 L202 15 L148 68 Z" />
                <path class="ear-inner" d="M58 78 L46 26 L86 68 Z" />
                <path class="ear-inner" d="M182 78 L194 26 L154 68 Z" />

                <!-- Face body -->
                <ellipse class="face-body" cx="120" cy="125" rx="78" ry="74" />
                <ellipse class="face-body-shine" cx="120" cy="125" rx="78" ry="74" />

                <!-- Left eye -->
                <g class="eye-group" id="eye-left-group">
                  <ellipse class="eye-white" id="eye-left-white" cx="88" cy="118" rx="22" ry="24" />
                  <circle class="pupil" id="eye-left-pupil" cx="88" cy="120" r="12" />
                  <circle class="eye-shine" cx="82" cy="112" r="5" />
                  <circle class="eye-shine-sm" cx="94" cy="126" r="2.5" />
                </g>

                <!-- Right eye -->
                <g class="eye-group" id="eye-right-group">
                  <ellipse class="eye-white" id="eye-right-white" cx="152" cy="118" rx="22" ry="24" />
                  <circle class="pupil" id="eye-right-pupil" cx="152" cy="120" r="12" />
                  <circle class="eye-shine" cx="146" cy="112" r="5" />
                  <circle class="eye-shine-sm" cx="158" cy="126" r="2.5" />
                </g>

                <!-- Happy eyes overlay (^_^) -->
                <g class="happy-eyes" id="happy-eyes" style="display:none">
                  <path class="happy-arc" d="M68 120 Q88 106 108 120" />
                  <path class="happy-arc" d="M132 120 Q152 106 172 120" />
                </g>

                <!-- Eyebrows -->
                <path class="eyebrow" id="eyebrow-left" d="M65 88 Q88 78 111 88" />
                <path class="eyebrow" id="eyebrow-right" d="M129 88 Q152 78 175 88" />

                <!-- Blush -->
                <ellipse class="blush" id="blush-left" cx="62" cy="132" rx="14" ry="9" />
                <ellipse class="blush" id="blush-right" cx="178" cy="132" rx="14" ry="9" />

                <!-- Mouth -->
                <path class="mouth" id="mouth" d="M108 148 Q120 158 132 148"></path>

                <!-- Particles -->
                <g class="particles" id="particles"></g>
              </svg>
            </div>
            <div class="face-shadow"></div>
          </div>

          <div class="face-info">
            <div class="mood-badge" id="status-mood">待机中</div>
            <h2 class="face-title" id="status-title">待机中</h2>
            <p class="face-message" id="status-message">正在连接状态服务...</p>
            <div class="face-meta" id="face-meta">
              <span class="tool-tag" id="tool-hint" style="display:none"></span>
              <span class="step-tag" id="step-hint" style="display:none"></span>
            </div>
            <p class="face-updated" id="status-updated">等待中</p>
          </div>
        </section>

        <aside class="panel panel-sessions">
          <h2 class="panel-title">
            <span class="title-icon">💬</span>会话状态
          </h2>
          <div class="panel-body" id="session-list">
            <div class="empty-hint">加载会话中...</div>
          </div>
          <div class="session-footer" id="session-footer">
            <span class="session-count" id="session-count">0 个活跃会话</span>
          </div>
        </aside>
      </main>

      <footer class="dash-footer">
        <h2 class="panel-title">
          <span class="title-icon">📊</span>情绪时间线
          <span class="timeline-range" id="timeline-range">最近 30 分钟</span>
        </h2>
        <div class="timeline-bar" id="emotion-timeline">
          <div class="timeline-empty">情绪变化将在这里显示</div>
        </div>
      </footer>
    </div>

    <script src="./dashboard.js"></script>
  </body>
</html>
