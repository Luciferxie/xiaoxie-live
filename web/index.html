<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小谢表情小窗</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="widget-shell">
      <section class="widget-card" aria-label="小谢状态小窗">
        <div class="screen-shell">
          <div class="screen-frame">
            <div class="screen-face face-stage 待机中" id="face-stage">
              <svg id="face-svg" viewBox="0 0 280 220" role="img" aria-labelledby="face-title face-desc">
                <title id="face-title">小谢表情屏</title>
                <desc id="face-desc">极简版：两只大眼和一个小嘴。</desc>

                <g class="eye eye-left" id="eye-left-group" transform="translate(76 70)">
                  <rect class="eye-shell" x="0" y="0" rx="20" ry="20" width="56" height="78"></rect>
                  <circle class="pupil" id="eye-left-pupil" cx="28" cy="39" r="15"></circle>
                </g>

                <g class="eye eye-right" id="eye-right-group" transform="translate(148 70)">
                  <rect class="eye-shell" x="0" y="0" rx="20" ry="20" width="56" height="78"></rect>
                  <circle class="pupil" id="eye-right-pupil" cx="28" cy="39" r="15"></circle>
                </g>

                <path class="mouth" id="mouth" d="M120 176 Q140 182 160 176"></path>
                <text class="hint-text" id="hint-text" x="220" y="58"> </text>
              </svg>
            </div>
          </div>

          <div class="base-shadow"></div>
          <div class="mini-badge" id="status-mood">待机中</div>
        </div>

        <section class="status-copy" aria-live="polite">
          <h1 id="status-title">待机中</h1>
          <p id="status-message">本地小窗已经就绪，正在等待状态更新。</p>
          <p class="tool-hint" id="tool-hint" style="display:none;"></p>
          <p class="step-hint" id="step-hint" style="display:none;"></p>
          <p class="status-updated" id="status-updated">等待中</p>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
